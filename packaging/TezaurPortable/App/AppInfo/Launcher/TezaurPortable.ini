; Configuration for the official PortableApps.com Launcher Generator.
; (The package also ships a ready-made TezaurPortable.exe, built from src/launcher.rs, that
;  does the same and additionally starts a bundled Ollama. Use this INI if you want to
;  regenerate the launcher with the PortableApps.com tools, e.g. for the app catalogue.)

[Launch]
ProgramExecutable=Tezaur\tezaur.exe
WorkingDirectory=%PAL:DataDir%
SinglePortableAppInstance=false

[Activate]
Registry=false

[Environment]
TEZAUR_DATA=%PAL:DataDir%
OLLAMA_MODELS=%PAL:DataDir%\ollama\models

[DirectoriesMove]
; nothing: the application never writes outside Data\
