server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ =404; }
  # Same-origin proxies to the model servers: no CORS setup needed. In the app set the address to
  #   <this site>/ollama      (API: Ollama)     or     <this site>/openai   (API: OpenAI-compatible)
  # Hostnames are resolved per request (variables + resolver) so nginx still starts when the model container is not up yet.
  resolver 127.0.0.11 ipv6=off valid=10s;
  location /ollama/ { set $ollama http://ollama:11434; rewrite ^/ollama/(.*)$ /$1 break; proxy_pass $ollama; proxy_buffering off; proxy_read_timeout 600s; }
  location /openai/ { set $openai http://host.docker.internal:1337; rewrite ^/openai/(.*)$ /v1/$1 break; proxy_pass $openai; proxy_buffering off; proxy_read_timeout 600s; }
}
