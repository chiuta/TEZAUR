# nginx variant (e.g. on a YunoHost box): proxy to GitHub Pages and add the headers.
server {
    listen 443 ssl http2;
    server_name tezaur.chiuta.ro www.tezaur.chiuta.ro;
    # ssl_certificate / ssl_certificate_key: from Let's Encrypt (certbot or YunoHost)
    if ($host = www.tezaur.chiuta.ro) { return 301 https://tezaur.chiuta.ro$request_uri; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / {
        # add_header in a location replaces the server-level ones, so they are repeated here
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        proxy_pass https://chiuta.github.io;
        proxy_set_header Host chiuta.github.io;
        proxy_ssl_server_name on;
    }
    location / {
        proxy_pass https://chiuta.github.io;
        proxy_set_header Host chiuta.github.io;
        proxy_ssl_server_name on;
    }
}
