name: real-variants
# Runs the distribution variants that cannot be run in the offline sandbox, on real GitHub runners with the real tools.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['variants/**', 'packaging/**', 'flake.nix', 'Dockerfile', '.github/workflows/real-variants.yml', 'src/**', 'Cargo.*']
env:
  REPO: ${{ github.repository }}
  OWNER: ${{ github.repository_owner }}
jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: nix build + run the packaged binary
        run: bash .github/annotate.sh bash -c 'nix build .#tezaur -L && ./result/bin/tezaur --version && nix-instantiate --parse variants/deploy/nix/nixos-module.nix >/dev/null'

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
      - run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: build the Flatpak from this checkout (placeholder source replaced by the local tree)
        run: |
          pip install aiohttp toml tomlkit
          curl -sSLo fcg.py https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 fcg.py Cargo.lock -o cargo-sources.json
          python3 - <<'EOF'
          import re
          s = open('variants/packaging/flatpak/tf.trom.Tezaur.yml').read()
          s = re.sub(r'- type: git\n\s+url: [^\n]+\n(\s+tag: [^\n]+\n)?(\s+branch: [^\n]+\n)?', '- type: dir\n        path: .\n', s)
          open('flatpak-ci.yml', 'w').write(s)
          EOF
          cat flatpak-ci.yml
          bash .github/annotate.sh flatpak-builder --user --force-clean --install-deps-from=flathub --install build flatpak-ci.yml
      - run: flatpak run tf.trom.Tezaur --version || flatpak run --command=tezaur tf.trom.Tezaur --version

  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: use the local tree as the snap source
        run: |
          mkdir -p snap && python3 - <<'EOF'
          import re
          s = open('variants/packaging/snap/snapcraft.yaml').read()
          s = re.sub(r'source: https://[^\n]+', 'source: .', s)
          s = re.sub(r'\n\s+source-tag: [^\n]+', '', s)
          open('snap/snapcraft.yaml', 'w').write(s)
          EOF
          cat snap/snapcraft.yaml
      - uses: snapcore/action-build@v1
        id: build
      - run: |
          sudo snap install --dangerous --classic ${{ steps.build.outputs.snap }} 2>&1 || sudo snap install --dangerous ${{ steps.build.outputs.snap }}
          tezaur --version

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
      - name: lint + template
        run: bash .github/annotate.sh bash -c 'helm lint variants/deploy/helm/tezaur --set token=x && helm template t variants/deploy/helm/tezaur --set token=x >/dev/null'
      - name: build the image, load it into kind
        run: |
          bash .github/annotate.sh docker build -t tezaur:ci .
          kind load docker-image tezaur:ci --name chart-testing
      - name: install the chart and wait for the pod
        run: bash .github/annotate.sh bash -c 'helm install t variants/deploy/helm/tezaur --set token=x --set image.repository=tezaur --set image.tag=ci --set image.pullPolicy=Never --wait --timeout 150s || { kubectl get pods -o wide; kubectl logs deploy/t-tezaur --tail=20; kubectl logs deploy/t-tezaur --previous --tail=20; exit 1; }'
      - name: call the API through a port-forward
        run: |
          kubectl port-forward svc/t-tezaur 8787:8787 &
          sleep 6
          bash .github/annotate.sh curl -sf -H "Authorization: Bearer x" http://127.0.0.1:8787/api/health

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: main image
        run: |
          bash .github/annotate.sh docker build -t tezaur:ci .
          bash .github/annotate.sh bash -c 'docker run -d --name tz -p 8787:8787 -e TEZAUR_TOKEN=x tezaur:ci; sleep 5; echo LOGS; docker logs tz; docker ps -a; curl -sf -H "Authorization: Bearer x" http://127.0.0.1:8787/api/health'
          docker rm -f tz
      - name: static web image (nginx) + compose file
        run: |
          python3 variants/build-web.py variants/docker/site
          docker build -t tezaur-web:ci variants/docker
          docker run -d --name wb -p 8080:80 tezaur-web:ci
          sleep 3; bash .github/annotate.sh curl -sf http://127.0.0.1:8080/index.html -o /dev/null
          docker compose -f variants/docker/docker-compose.yml config -q
      - name: Docker Desktop extension image builds
        run: bash .github/annotate.sh bash -c 'docker build -t tezaur:ci . && docker build --build-arg SERVER_IMAGE=tezaur:ci -t tezaur-ext:ci variants/deploy/docker-desktop'

  quadlet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/annotate.sh docker build -t localhost/tezaur:ci .
      - name: Quadlet dry-run with the real generator, then run the generated unit
        run: |
          sudo apt-get update && sudo apt-get install -y podman
          sed -i "s#ghcr.io/OWNER/tezaur:latest#localhost/tezaur:ci#; s#^Image=.*#Image=localhost/tezaur:ci#" variants/deploy/quadlet/tezaur.container
          mkdir -p ~/.config/containers/systemd && cp variants/deploy/quadlet/tezaur.container ~/.config/containers/systemd/
          docker save localhost/tezaur:ci | podman load
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          sudo loginctl enable-linger $USER; sleep 2
          bash .github/annotate.sh bash -c '/usr/lib/systemd/user-generators/podman-user-generator /tmp/qout /tmp/qout /tmp/qout 2>&1; /usr/libexec/podman/quadlet -dryrun -user 2>&1 || /usr/lib/podman/quadlet -dryrun -user'
          systemctl --user daemon-reload
          systemctl --user start tezaur.service; sleep 6
          systemctl --user status tezaur.service --no-pager | head -12
          podman ps

  mediawiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: a real tezaur server over a tiny library, with a fake model
        run: |
          mkdir lib && echo "The burden of proof lies with the body assessing the qualification." > lib/lisbon_convention.txt
          (cd lib && python3 ../variants/tests/mock_ollama.py 11434 >/dev/null 2>&1 &)
          cd lib && export TEZAUR_INDEX=$PWD/t.idx TEZAUR_HOST=http://127.0.0.1:11434 TEZAUR_MODEL=m && ../target/release/tezaur ingest . >/dev/null
          (nohup ../target/release/tezaur serve --port 8787 >/dev/null 2>&1 &); sleep 2; curl -sf http://127.0.0.1:8787/api/health
      - name: real MediaWiki (sqlite, host network) with the extension; render the tag through the parse API
        run: |
          docker run -d --name mw --network host -v $PWD/variants/cms/mediawiki/Tezaur:/var/www/html/extensions/Tezaur mediawiki:1.42
          sleep 12
          docker exec mw bash -c 'mkdir -p /var/www/data && chown -R www-data:www-data /var/www/data'
          docker exec mw php maintenance/run.php install --dbtype sqlite --dbpath /var/www/data --pass 'Aa1!aaaaaaaa1' --server http://127.0.0.1 --scriptpath "" TezaurWiki Admin
          docker exec mw bash -c 'chown -R www-data:www-data /var/www/data; chmod 644 LocalSettings.php'
          docker exec mw bash -c 'echo "wfLoadExtension( \"Tezaur\" ); \$wgTezaurServer = \"http://127.0.0.1:8787\";" >> LocalSettings.php'
          bash .github/annotate.sh bash -c 'curl -s --get "http://127.0.0.1/api.php" --data-urlencode "action=parse" --data-urlencode "text=<tezaur>burden of proof</tezaur>" --data-urlencode "contentmodel=wikitext" --data-urlencode "prop=text" --data-urlencode "format=json" | tee /tmp/mw.json; grep -qi "burden of proof lies" /tmp/mw.json'

  zotero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: real Zotero 7 under Xvfb with the plugin installed in a fresh profile
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libdbus-glib-1-2 libasound2t64 zip
          curl -sSL "https://www.zotero.org/download/client/dl?channel=release&platform=linux-x86_64" -o z.tar.xz || true
          file z.tar.xz; mkdir z && tar -xf z.tar.xz -C z --strip-components=1 || tar -xjf z.tar.xz -C z --strip-components=1
          ID=$(python3 -c "import json;print(json.load(open('variants/editors/zotero/manifest.json'))['applications']['zotero']['id'])")
          (cd variants/editors/zotero && zip -qr ../../../p.xpi .)
          mkdir -p prof/extensions && cp p.xpi "prof/extensions/$ID.xpi"
          xvfb-run -a timeout 60 z/zotero -profile "$PWD/prof" -no-remote -ZoteroDebugText > z.log 2>&1 || true
          grep -i "tezaur" z.log | head -20
          bash .github/annotate.sh bash -c 'grep -qi tezaur z.log'

  firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash variants/build-extension.sh && ls dist
      - name: real Firefox installs the add-on and the content script runs on a page
        run: |
          pip install selenium
          bash .github/annotate.sh python3 variants/tests/test_firefox_real.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Inno Setup installer built, installed silently, binary run
        shell: bash
        run: |
          mkdir -p dist/TezaurPortable && cp target/release/tezaur.exe tezaur.html dist/TezaurPortable/
          choco install innosetup -y --no-progress
          curl -sSLo variants/windows/Romanian.isl https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Romanian.isl
          bash .github/annotate.sh "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" variants/windows/tezaur.iss
          ls variants/windows
      - name: MSIX package built with makeappx
        shell: bash
        run: |
          mkdir -p pk/Assets && cp variants/deploy/msix/AppxManifest.xml pk/ && cp target/release/tezaur.exe pk/TezaurPortable.exe
          for f in logo logo150 logo44; do cp variants/extension/icon-128.png pk/Assets/$f.png; done
          MK=$(find "/c/Program Files (x86)/Windows Kits/10/bin" -name makeappx.exe | grep x64 | head -1)
          MSYS_NO_PATHCONV=1 bash .github/annotate.sh "$MK" pack /d pk /p t.msix /nv
          ls -l t.msix
      - name: winget manifests validated
        shell: pwsh
        run: bash .github/annotate.sh winget validate --manifest variants/packaging/winget
      - name: Scoop manifest installs with real Scoop (zip served from localhost, same manifest otherwise)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            Invoke-RestMethod get.scoop.sh -outfile i.ps1; .\i.ps1 -RunAsAdmin
            $env:PATH += ";$HOME\scoop\shims"
            New-Item -ItemType Directory pz | Out-Null
            Copy-Item target/release/tezaur.exe pz/tezaur.exe; Copy-Item target/release/tezaur.exe pz/TezaurPortable.exe
            Compress-Archive -Path pz/* -DestinationPath tezaur-windows.zip
            $h = (Get-FileHash tezaur-windows.zip -Algorithm SHA256).Hash.ToLower()
            $j = Get-Content variants/packaging/scoop/tezaur.json | ConvertFrom-Json
            $j.version = "0.4.0"; $j.url = "http://127.0.0.1:8099/tezaur-windows.zip"; $j.hash = $h
            $j.PSObject.Properties.Remove("autoupdate"); $j.PSObject.Properties.Remove("checkver")
            $j | ConvertTo-Json -Depth 5 | Set-Content tezaur-ci.json
            $srv = Start-Process python -ArgumentList "-m","http.server","8099" -PassThru; Start-Sleep 3
            $diag = (Get-Command scoop | Out-String) + (scoop --version | Out-String) + (Get-Content tezaur-ci.json | Out-String)
            $out = (scoop install ./tezaur-ci.json 2>&1 | Out-String); Write-Host $out
            if (-not (scoop prefix tezaur)) { throw ($diag + "OUT:" + $out + (scoop list | Out-String)) }
            $pre = scoop prefix tezaur; Write-Host "installed at $pre"; Get-ChildItem $pre
            & "$pre\tezaur.exe" --version
            scoop list
            Stop-Process $srv
          } catch { $m = ($_ | Out-String) -replace "`r?`n", '%0A'; Write-Host "::error::$m"; exit 1 }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Homebrew formula and cask audited/styled by real brew
        run: |
          brew tap-new local/t
          cp variants/packaging/homebrew/tezaur.rb "$(brew --repository local/t)/Formula/tezaur.rb"
          mkdir -p "$(brew --repository local/t)/Casks" && cp variants/deploy/cask/tezaur.rb "$(brew --repository local/t)/Casks/tezaur.rb"
          sed -i '' "s#OWNER/tezaur#$REPO#g" "$(brew --repository local/t)/Formula/tezaur.rb"
          bash .github/annotate.sh brew style local/t/tezaur/tezaur
          bash .github/annotate.sh brew install --HEAD --build-from-source local/t/tezaur
          tezaur --version
      - name: iOS app (WKWebView) builds for the simulator with xcodebuild
        run: |
          brew install xcodegen
          cd variants/ios && xcodegen
          bash ../../.github/annotate.sh xcodebuild -project Tezaur.xcodeproj -scheme Tezaur -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git cargo poppler tesseract
      - uses: actions/checkout@v4
      - name: makepkg with the PKGBUILD against the local tarball
        run: |
          git config --global --add safe.directory '*'
          useradd b && mkdir /b && cp variants/packaging/aur/PKGBUILD /b/ && chown -R b /b
          git archive --prefix=tezaur-0.4.0/ HEAD | gzip > /b/tezaur-0.4.0.tar.gz
          cd /b && sed -i 's#^source=.*#source=("$pkgname-$pkgver.tar.gz")#; s#^pkgver=.*#pkgver=0.4.0#' PKGBUILD
          bash $GITHUB_WORKSPACE/.github/annotate.sh su b -c 'export CARGO_HOME=/tmp/cargo; cd /b && makepkg --noconfirm --skipchecksums -f'
          ls /b/*.pkg.tar.*
