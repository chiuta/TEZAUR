[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tezaur-client"
version = "0.3.0"
description = "Python client, CLI and Anki exporter for TEZAUR, a local citation-grounded research assistant"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Alexio", email = "alexio@trom.tf" }]
dependencies = []
keywords = ["research", "thesis", "rag", "citations", "anki", "local-first"]

[project.optional-dependencies]
anki = ["genanki>=0.13"]
jupyter = ["ipython", "jupyter-server-proxy"]

[project.entry-points.jupyter_serverproxy_servers]
tezaur = "tezaur_client.proxy:setup_tezaur"

[project.scripts]
tezaur-py = "tezaur_client.cli:main"
tezaur-apkg = "tezaur_client.apkg:main"

[tool.setuptools]
packages = ["tezaur_client"]
