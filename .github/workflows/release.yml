name: release-variants
# Run by hand (Actions → Run workflow) or on a tag v*. Builds every variant that needs a toolchain.
on:
  workflow_dispatch:
    inputs:
      tag: { description: 'Tag to release (created from the selected branch if it does not exist), e.g. v0.4.0', required: false }
  push:
    tags: ['v*']
permissions: { contents: write, id-token: write, attestations: write }
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    outputs: { tag: '${{ steps.t.outputs.tag }}' }
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Create the GitHub Release (notes from .github/release-notes/<tag>.md when present)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          f=.github/release-notes/${{ steps.t.outputs.tag }}.md; [ -f "$f" ] || { echo "Release ${{ steps.t.outputs.tag }}" > /tmp/n.md; f=/tmp/n.md; }
          gh release view "${{ steps.t.outputs.tag }}" >/dev/null 2>&1 || gh release create "${{ steps.t.outputs.tag }}" --title "TEZAUR ${{ steps.t.outputs.tag }}" --notes-file "$f" --target "${{ github.sha }}"
  assets:
    needs: release
    # Attach CLI binaries (and the .deb) to the GitHub Release of the tag.
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir -p out/tezaur-${{ matrix.name }}
          cp LICENSE README.md out/tezaur-${{ matrix.name }}/
          if [ "${{ runner.os }}" = Windows ]; then cp target/release/tezaur.exe out/tezaur-${{ matrix.name }}/; (cd out && 7z a tezaur-${{ needs.release.outputs.tag }}-${{ matrix.name }}.zip tezaur-${{ matrix.name }}); else cp target/release/tezaur out/tezaur-${{ matrix.name }}/; tar -C out -czf out/tezaur-${{ needs.release.outputs.tag }}-${{ matrix.name }}.tar.gz tezaur-${{ matrix.name }}; fi
          if [ "${{ runner.os }}" = Linux ]; then ./variants/build-deb.sh && cp dist/*.deb out/; fi
          cd out && : > SHA256SUMS-${{ matrix.name }}.txt && for f in *.tar.gz *.zip *.deb; do [ -f "$f" ] && { sha256sum "$f" 2>/dev/null || shasum -a 256 "$f"; } >> SHA256SUMS-${{ matrix.name }}.txt; done; true
      - name: Attest build provenance (keyless, Sigstore; verify with `gh attestation verify FILE -R OWNER/REPO`)
        uses: actions/attest-build-provenance@v2
        with: { subject-path: 'out/*.tar.gz, out/*.zip, out/*.deb' }
      - name: Upload to the release
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          shopt -s nullglob
          files=(out/*.tar.gz out/*.zip out/*.deb out/SHA256SUMS-*.txt)
          ls -la "${files[@]}"
          gh release upload "${{ needs.release.outputs.tag }}" "${files[@]}" --clobber -R "${{ github.repository }}"
  cli:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - run: cargo test --release
      - uses: actions/upload-artifact@v4
        with:
          name: tezaur-cli-${{ matrix.os }}
          path: |
            target/release/tezaur
            target/release/tezaur.exe
            target/release/TezaurPortable.exe
          if-no-files-found: ignore
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release && ./variants/build-deb.sh
      - uses: actions/upload-artifact@v4
        with: { name: tezaur-deb, path: dist/*.deb }
  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./variants/build-extension.sh
      - uses: actions/upload-artifact@v4
        with: { name: tezaur-extensions, path: dist/*.zip }
  electron:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: variants/electron } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: bash ../../.github/annotate.sh npm run dist
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: tezaur-electron-${{ matrix.os }}
          path: dist/electron/*.*
  tauri:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: variants/tauri } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: tezaur-tauri-${{ matrix.os }}
          path: variants/tauri/src-tauri/target/release/bundle/**
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 variants/build-web.py variants/docker/site && cp pwa/manifest.webmanifest pwa/sw.js pwa/icon-*.png variants/docker/site/
      - run: docker build -t tezaur variants/docker
  editors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test variants/core/test.js
      - run: ./variants/build-obsidian.sh && ./variants/build-vscode.sh && ./variants/build-office.sh
      - run: cd dist/vscode && npx --yes @vscode/vsce package --allow-missing-repository --skip-license
      - uses: actions/upload-artifact@v4
        with:
          name: tezaur-editors
          path: |
            dist/obsidian
            dist/vscode/*.vsix
            dist/office
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd variants/ios && xcodegen && xcodebuild -project Tezaur.xcodeproj -scheme Tezaur -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
  rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release && cargo install cargo-generate-rpm --locked && cargo generate-rpm
      - uses: actions/upload-artifact@v4
        with: { name: tezaur-rpm, path: target/generate-rpm/*.rpm }
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: .\build-portable.bat
        shell: cmd
      - run: choco install innosetup -y --no-progress
      - run: curl -fsSL https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Romanian.isl -o variants/windows/Romanian.isl
        shell: bash
      - run: bash .github/annotate.sh "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" variants/windows/tezaur.iss
        shell: bash
      - uses: actions/upload-artifact@v4
        with: { name: tezaur-windows-installer, path: dist/TEZAUR-setup-*.exe }
  capacitor-android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: variants/capacitor } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm install && npm run android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: tezaur-capacitor-apk, path: variants/capacitor/android/app/build/outputs/apk/debug/*.apk }
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils texlive-latex-base texlive-latex-recommended php-cli vim pandoc zip && pip install pynacl lupa genanki ipython ipykernel nbclient nbformat pyyaml playwright && python -m playwright install --with-deps chromium
      - run: cargo build --release
      - run: bash variants/build-obsidian.sh && bash variants/build-vscode.sh && bash variants/build-extension.sh
      - run: bash build-portable.sh
      - run: variants/build-plugins.sh
      - run: bash .github/annotate.sh bash variants/tests/run-all.sh
      - run: ./variants/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tezaur-plugins
          path: |
            dist/tezaur-plugins.zip
            dist/plugins/*
            dist/*.deb
  publish:
    # on a v* tag: gathers every artifact of this run and attaches it to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, deb, extensions, electron, tauri, editors, rpm, windows-installer, capacitor-android, plugins]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: |
          mkdir out
          find artifacts -type f \( -name '*.zip' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.apk' -o -name '*.vsix' -o -name '*.xpi' -o -name '*.jpl' -o -name '*.tgz' -o -name '*.whl' -o -name '*.alfredworkflow' -o -name 'tezaur' \) -print0 | while IFS= read -r -d '' f; do
            d=$(basename "$(dirname "$f")"); cp "$f" "out/${d}__$(basename "$f")"
          done
          (cd out && sha256sum * > SHA256SUMS.txt); ls -la out
      - uses: softprops/action-gh-release@v2
        with: { files: out/*, generate_release_notes: true }
