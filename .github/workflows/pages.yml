name: pages
# Publishes the PWA to GitHub Pages: https://OWNER.github.io/REPO/ (installable, works offline after the first visit).
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions: { contents: read, pages: write, id-token: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 variants/build-pwa.py && mkdir site && cp -r pwa/. site/ && cp -r dist/office site/office 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: dep
        uses: actions/deploy-pages@v4
