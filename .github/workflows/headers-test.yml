name: headers-test
on:
  push:
    paths: ['deploy/headers/**', '.github/workflows/headers-test.yml']
  workflow_dispatch:
jobs:
  headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nginx-light caddy && sudo systemctl stop nginx caddy || true
      - run: bash deploy/headers/test-local.sh .
