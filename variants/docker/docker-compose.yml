# docker compose up -d   →   http://localhost:8080   (then: docker compose exec ollama ollama pull llama3.1:8b)
services:
  tezaur:
    build: .
    ports: ["8080:80"]
    depends_on: [ollama]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
  ollama:
    image: ollama/ollama
    volumes: ["ollama:/root/.ollama"]
    restart: unless-stopped
    # GPU (NVIDIA): add  deploy: {resources: {reservations: {devices: [{capabilities: [gpu]}]}}}
volumes:
  ollama:
