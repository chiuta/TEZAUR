name: Tezaur
options: { bundleIdPrefix: tf.trom, deploymentTarget: { iOS: "15.0" } }
targets:
  Tezaur:
    type: application
    platform: iOS
    sources:
      - Sources
      - { path: ../../tezaur.html, buildPhase: resources }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tf.trom.tezaur
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: TEZAUR
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connects to your model server (Ollama, Jan) on the local network."
