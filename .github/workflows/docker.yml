name: docker-images
# Publishes two images to GitHub Container Registry:
#   ghcr.io/<owner>/tezaur-server  (Rust server: web app + API + OCR + model proxy)
#   ghcr.io/<owner>/tezaur-web     (static page + nginx proxy, see variants/docker)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions: { contents: read, packages: write }
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash .github/annotate.sh bash .github/docker-publish.sh "${{ github.repository_owner }}"
