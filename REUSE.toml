version = 1
SPDX-PackageName = "TEZAUR"
SPDX-PackageSupplier = "Alexio <alexio@trom.tf>"
SPDX-PackageDownloadLocation = "https://github.com/chiuta/TEZAUR"

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Alexio <alexio@trom.tf>"
SPDX-License-Identifier = "MIT"

# pdf.js (pdfjs-dist 3.11.174, Mozilla Foundation and contributors), vendored unmodified in three places.
[[annotations]]
path = "**/vendor/pdfjs/**"
precedence = "override"
SPDX-FileCopyrightText = "2023 Mozilla Foundation and pdf.js contributors"
SPDX-License-Identifier = "Apache-2.0"

# tiny_http 0.12.0 (Pierre Krieger, Frank Denis and contributors), vendored with one patch (vendor/tiny_http/PATCHES.md).
[[annotations]]
path = "vendor/tiny_http/**"
precedence = "override"
SPDX-FileCopyrightText = "2014-2023 tiny-http contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"
