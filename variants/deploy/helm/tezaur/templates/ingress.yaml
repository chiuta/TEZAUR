{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-tezaur
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "900"   # local models answer slowly
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-tezaur
                port: { number: {{ .Values.service.port }} }
  {{- if .Values.ingress.tls }}
  tls: [{ hosts: [{{ .Values.ingress.host }}], secretName: {{ .Release.Name }}-tezaur-tls }]
  {{- end }}
{{- end }}
