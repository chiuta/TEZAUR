server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ =404; }
  # Same-origin proxies to the model servers: no CORS setup needed. In the app set the address to
  #   <this site>/ollama      (API: Ollama)     or     <this site>/openai   (API: OpenAI-compatible)
  location /ollama/ { proxy_pass http://ollama:11434/; proxy_buffering off; proxy_read_timeout 600s; }
  location /openai/ { proxy_pass http://host.docker.internal:1337/v1/; proxy_buffering off; proxy_read_timeout 600s; }
}
